<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transmissão de Tela</title>
</head>
<body>
    <h1>Exemplo de Transmissão de Tela</h1>
    <button id="btnStart">Iniciar Transmissão</button>
    <button id="btnStop" disabled>Parar Transmissão</button>
    <br><br>
    <video id="videoElement" autoplay playsinline width="800"></video>

    <script>
        const videoElement = document.getElementById('videoElement');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        let mediaStream = null;

        btnStart.addEventListener('click', async () => {
            try {
                // Solicita a captura da tela ao navegador
                mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                // Exibe o fluxo de vídeo no elemento <video>
                videoElement.srcObject = mediaStream;

                btnStart.disabled = true;
                btnStop.disabled = false;

                // Detecta quando o usuário clica no botão nativo "Parar de Compartilhar" do navegador
                mediaStream.getVideoTracks()[0].onended = () => {
                    stopSharing();
                };
            } catch (error) {
                console.error("Erro ao tentar capturar a tela:", error);
            }
        });

        btnStop.addEventListener('click', () => {
            stopSharing();
        });

        function stopSharing() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
        }
    </script>
</body>
</html>
