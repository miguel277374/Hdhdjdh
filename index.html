<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gravador e Transmissor Local</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background: #121212; color: #fff; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #555; cursor: not-allowed; }
        video { margin-top: 20px; border: 2px solid #444; background: #000; max-width: 90%; border-radius: 8px; }
        #status { color: #ff6b6b; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Transmissão de Tela Local</h2>
    <p>Clique no botão abaixo para escolher a tela/aba que deseja exibir:</p>
    
    <button id="iniciar">Iniciar Transmissão</button>
    <button id="parar" disabled>Encerrar</button>
    
    <div id="status"></div>
    <br>
    <div>
        <video id="tela" autoplay playsinline controls width="700"></video>
    </div>

    <script>
        const btnIniciar = document.getElementById('iniciar');
        const btnParar = document.getElementById('parar');
        const videoElem = document.getElementById('tela');
        const statusElem = document.getElementById('status');
        let fluxoTela = null;

        btnIniciar.addEventListener('click', async () => {
            statusElem.textContent = "";
            try {
                // Solicita o compartilhamento da tela ao navegador
                fluxoTela = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                // Joga o fluxo de vídeo direto no elemento HTML <video>
                videoElem.srcObject = fluxoTela;
                
                btnIniciar.disabled = true;
                btnParar.disabled = false;

                // Monitora se o usuário fechou o compartilhamento pelo botão nativo do navegador
                fluxoTela.getVideoTracks()[0].onended = () => {
                    fecharTransmissao();
                };

            } catch (erro) {
                console.error("Erro:", erro);
                statusElem.textContent = "Ação cancelada ou bloqueada pelo navegador (" + erro.name + ").";
            }
        });

        btnParar.addEventListener('click', () => {
            fecharTransmissao();
        });

        function fecharTransmissao() {
            if (fluxoTela) {
                fluxoTela.getTracks().forEach(trilha => trilha.stop());
                videoElem.srcObject = null;
            }
            btnIniciar.disabled = false;
            btnParar.disabled = true;
            statusTransmissao();
        }

        function statusTransmissao() {
            statusElem.textContent = "Transmissão finalizada.";
        }
    </script>

</body>
</html>
