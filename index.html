<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Transmissão de Tela</title>
</head>
<body>
    <h2>Teste de Captura de Tela</h2>
    <button id="btnStart" style="padding: 10px 20px; font-size: 16px;">Iniciar Transmissão</button>
    <button id="btnStop" style="padding: 10px 20px; font-size: 16px;" disabled>Parar</button>
    <br><br>
    <p id="status" style="color: red;"></p>
    <video id="videoElement" autoplay playsinline controls width="600" style="background: #000;"></video>

    <script>
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const videoElement = document.getElementById('videoElement');
        const statusText = document.getElementById('status');
        let mediaStream = null;

        btnStart.addEventListener('click', async () => {
            statusText.textContent = "";
            try {
                // Tenta capturar a tela
                mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: false
                });

                videoElement.srcObject = mediaStream;
                btnStart.disabled = true;
                btnStop.disabled = false;

                // Se o usuário clicar no botão "Parar" nativo do navegador
                mediaStream.getVideoTracks()[0].onended = () => {
                    pararTransmissao();
                };

            } catch (error) {
                console.error("Erro capturado:", error);
                statusText.textContent = "Erro: " + error.name + " - " + error.message;
            }
        });

        btnStop.addEventListener('click', () => {
            pararTransmissao();
        });

        function pararTransmissao() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusText.textContent = "Transmissão encerrada.";
        }
    </script>
</body>
</html>
